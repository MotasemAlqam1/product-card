<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="container">
        <div class="product-card">
            <div class="product-image-container">
                <span class="discount">-30%</span>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-lW4gZ99GIFBGSE7piNrQ4PWHIxVWOewizOpOjcBlVg&s=10"
                    alt="Aria Wireless Headphones" class="product-image">
            </div>
            <div class="product-details">
                <h2 class="product-title">Aria Wireless Headphones</h2>
                <p class="product-description">Active noise-cancelling, plush earcups, and 30 hours of battery life on a
                    single charge.</p>
                <div class="product-price">
                    <span class="discounted-price">$69.99</span>
                    <span class="original-price">$99.99</span>
                </div>
                <div class="product-actions">
                    <button class="add-to-cart">Add to Cart</button>
                    <button class="buy-now">Buy Now</button>
                </div>
            </div>
        </div>
        <p class="stock-status">
            ⚠️ Only 3 left in stock
        </p>
    </main>

</body>

</html>
